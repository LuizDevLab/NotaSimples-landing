faq:
  titulo: "Perguntas frequentes sobre a NFS-e Nacional"
  perguntas:
    - pergunta: "Sou do Simples Nacional. Sou obrigado a emitir a NFS-e no padrão nacional?"
      resposta: "Sim, se você presta serviço. Desde 1º de novembro de 2026, microempresas (ME) e empresas de pequeno porte (EPP) do Simples Nacional precisam emitir a NFS-e no padrão nacional. A regra está na Resolução CGSN nº 191/2026."
      # fonte: https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2026/agosto/simples-nacional-nfs-e-nacional-sera-obrigatoria-para-me-e-epp-a-partir-de-1o-de-novembro-de-2026

    - pergunta: "E o MEI, também precisa?"
      resposta: "Precisa. O MEI que presta serviço emite a NFS-e no padrão nacional desde 1º de setembro de 2023, pela Resolução CGSN nº 169/2022. Quando o cliente é pessoa física, a emissão é opcional."
      # fonte: https://www.gov.br/nfse/pt-br/biblioteca/legislacao-aplicavel-ao-mei
      # CONFERIR: regra da emissão opcional para pessoa física

    - pergunta: "Posso continuar emitindo no site da minha prefeitura?"
      resposta: "Se você é ME ou EPP do Simples, não. Desde novembro de 2026 a nota precisa sair no padrão nacional, pelo Emissor Nacional do governo ou por um sistema conectado a ele, como o NotaSimples. A nota do padrão nacional vale em todo o Brasil."
      # fonte: https://crcms.org.br/simples-nacional-nfs-e-nacional-obrigatoria-para-me-e-epp-a-partir-de-1o-de-novembro-de-2026/
      # CONFERIR: casos de municípios com sistema próprio integrado ao ambiente nacional

    - pergunta: "O que é o Portal Nacional da NFS-e?"
      resposta: "É o site do governo federal para emitir a nota fiscal de serviço no padrão nacional, em gov.br/nfse. Ele é gratuito, mas foi pensado para quem já entende de tributação: você precisa saber sozinho o código do serviço, as regras do ISS e quando há retenção."
      # fonte: https://www.gov.br/nfse/pt-br/pagina-inicial/

    - pergunta: "Se o emissor do governo é gratuito, por que usar o NotaSimples?"
      resposta: "Pelo tempo e pela tranquilidade. No portal, você preenche tudo do zero e responde sozinho por cada campo. No NotaSimples, você responde perguntas simples, recebe ajuda em cada etapa, salva modelos, manda a nota ao cliente na hora e acompanha seu faturamento. E, se travar, fala com uma pessoa."

    - pergunta: "Preciso preencher IBS e CBS na nota em 2026?"
      resposta: "Não. Em 2026, quem é do Simples Nacional ou MEI não precisa aplicar as regras de IBS e CBS na NFS-e. A partir de 1º de janeiro de 2027, essas informações passam a ser exigidas nos casos previstos na regulamentação. O NotaSimples vai acompanhar essa mudança por você."
      # fonte: https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2026/agosto/simples-nacional-nfs-e-nacional-sera-obrigatoria-para-me-e-epp-a-partir-de-1o-de-novembro-de-2026
      # fonte: LC 214/2025, art. 348 (citado por https://actana.com.br/reforma-tributaria-nfse-simples-nacional)

    - pergunta: "O NotaSimples substitui o meu contador?"
      resposta: "Não. Ele resolve a emissão da nota no dia a dia, e os relatórios deixam tudo pronto para o seu contador. Vocês dois saem ganhando."

    - pergunta: "Quando o NotaSimples fica pronto?"
      resposta: "Estamos nos últimos ajustes. Entre na lista de espera: você testa antes de todo mundo e garante uma condição especial de lançamento."

    - pergunta: "O que vocês fazem com os meus dados da lista de espera?"
      resposta: "Usamos só para avisar sobre o lançamento do NotaSimples. Não vendemos nem repassamos seus dados. Você pode pedir para sair da lista quando quiser."

